<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emerald Agencies - Accounts</title>
<style>:root{--bg:#f4f6f5;--panel:#fff;--ink:#16221f;--mut:#60706b;--line:#dfe6e3;--acc:#0b6b5c;--acc2:#0f8f7a;--accbg:#e4f3ef;--warn:#b45309;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fde8e6;--ok:#0a7a4b;--okbg:#dff5e9;--hd:#0b6b5c;--hdink:#fff;--row:#f8faf9;--sh:0 1px 2px rgba(16,34,31,.06),0 4px 14px rgba(16,34,31,.05);
--c1:#0b6b5c;--c2:#e08a1e;--c3:#3b6fb6;--c4:#b5446e;--c5:#7a8f1a;--c6:#6b5ca5}
:root[data-theme=dark]{--bg:#0f1715;--panel:#17211e;--ink:#e6efec;--mut:#92a59f;--line:#26342f;--acc:#38c2a8;--acc2:#4fd1b8;--accbg:#173a33;--warn:#f0b24c;--warnbg:#3a2d12;--bad:#ff8a7d;--badbg:#3d1c19;--ok:#58d49a;--okbg:#12362a;--hd:#1d3b34;--hdink:#e6efec;--row:#1a2623;--sh:none;--c1:#38c2a8;--c2:#f0a43c;--c3:#6fa0e8;--c4:#e57aa0;--c5:#b4cc4a;--c6:#a597e0}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-weight:700;font-size:17px;letter-spacing:.3px;color:var(--acc)}
#top .brand small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);letter-spacing:.8px;margin-top:-2px}
#top .sp{flex:1}
#top label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
#menu{display:none}
#side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
#side a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px;font-weight:500}
#side a:hover{background:var(--accbg)}#side a.on{background:var(--acc);color:#fff}
:root[data-theme=dark] #side a.on{color:#08201b}
#side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:12px 12px 4px}
#main{overflow:auto;padding:18px 22px 60px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mut);margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.bar .f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mut)}
.bar .f.chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:7px}
input[type=text],input[type=date],input[type=number],select,textarea,input:not([type]){background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
:root[data-theme=dark] .btn{color:#08201b}
.btn:hover{filter:brightness(1.08)}.btn.sec{background:var(--accbg);color:var(--acc)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut);font-weight:600}
.tabs a.on{color:var(--acc);border-color:var(--acc)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--hd);color:var(--hdink);text-align:left;padding:8px 8px;font-size:12px;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th.n,td.n{text-align:right}
td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
td.w{white-space:normal;min-width:160px}
tbody tr:nth-child(even){background:var(--row)}tbody tr:hover{background:var(--accbg)}
tfoot td{font-weight:700;background:var(--accbg);position:sticky;bottom:0;border-top:2px solid var(--acc)}
a.lk{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:600}a.lk:hover{text-decoration:underline}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.mut{background:var(--accbg);color:var(--mut)}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;color:var(--mut);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--accbg);border-radius:8px;padding:6px 11px;font-size:12.5px}.chip b{font-variant-numeric:tabular-nums}
#mask{position:fixed;inset:0;background:rgba(8,20,17,.55);display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:50}
#mask.on{display:flex}
.modal{background:var(--panel);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px 20px}
.modal.wide{width:min(900px,100%)}
.modal h2{font-size:17px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:10px 0}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}.fg .full{grid-column:1/3}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:99;align-items:center}
.t{background:#16221f;color:#fff;padding:9px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px}
.t.err{background:#b42318}
.ac{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:260px;overflow:auto;z-index:80;min-width:260px}
.ac div{padding:6px 10px;cursor:pointer}.ac div.on,.ac div:hover{background:var(--accbg)}
.dz{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s;position:relative}
.dz:hover,.dz.on{border-color:var(--acc);background:var(--accbg)}.dz.on{transform:scale(1.01)}
.dz .ic{font-size:30px;line-height:1;color:var(--acc)}.dz .t1{font-weight:600;color:var(--ink);margin:6px 0 2px}
.dz input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.imp .card{display:flex;flex-direction:column}.imp .card h2{display:flex;align-items:center;gap:8px}
.imp .card h2:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.card h2{letter-spacing:.2px}.nav-new{font-size:9px;background:var(--c2);color:#fff;border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#side a{transition:.12s}#side a:hover{transform:translateX(2px)}
.kpi{transition:.15s}.kpi:hover{transform:translateY(-2px)}
.btn{transition:.12s}.btn:active{transform:scale(.97)}
#top{box-shadow:var(--sh)}th{letter-spacing:.3px}
.imp{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.mut{color:var(--mut)}.small{font-size:12px}.right{text-align:right}
.svgc text{fill:var(--mut);font-size:11px}.svgc .lbl{fill:var(--ink)}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 100px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .tr{background:var(--accbg);border-radius:5px;height:14px}.hbar .fl{background:var(--c1);height:14px;border-radius:5px}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:820px){#app{grid-template-columns:1fr}#side{position:fixed;left:0;top:56px;bottom:0;width:230px;transform:translateX(-100%);transition:.2s;z-index:40}#side.on{transform:none}#menu{display:block}#top{grid-column:1}#main{padding:12px}.fg{grid-template-columns:1fr}.fg .full{grid-column:1}}
#sync{font-size:12px;cursor:pointer;padding:4px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap;font-weight:600}#sync.warn{background:var(--warnbg);color:var(--warn)}#sync.err{background:var(--badbg);color:var(--bad)}
.spin{display:inline-block;width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pre{white-space:pre-wrap;background:var(--accbg);border-radius:8px;padding:10px 12px;font-size:12.5px}

/* ===== v3: pill tabs + animations ===== */
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--accbg);padding:4px;border-radius:12px;border:0;margin-bottom:14px}
.tabs a{border:0;border-radius:9px;padding:7px 16px;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
.tabs a:hover{color:var(--acc)}.tabs a.on{background:var(--panel);color:var(--acc);box-shadow:0 2px 8px rgba(11,107,92,.18)}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dn{from{stroke-dasharray:0 339.3}}
@keyframes rowin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
#view>*{animation:fup .45s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}#view>*:nth-child(n+6){animation-delay:.25s}
.kpi{animation:fup .5s cubic-bezier(.2,.7,.2,1) both}.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}.kpi:nth-child(5){animation-delay:.24s}.kpi:nth-child(n+6){animation-delay:.3s}
.kpi{border-top:3px solid var(--acc)}.kpi:nth-child(2n){border-top-color:var(--c2)}.kpi:nth-child(3n){border-top-color:var(--c3)}
.svgc rect{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.svgc g rect:nth-child(2n){animation-delay:.08s}
.hbar .fl{transform-origin:left;animation:growx .9s cubic-bezier(.2,.7,.2,1) both}
.hbar:nth-child(2) .fl{animation-delay:.05s}.hbar:nth-child(3) .fl{animation-delay:.1s}.hbar:nth-child(4) .fl{animation-delay:.15s}.hbar:nth-child(n+5) .fl{animation-delay:.2s}
tbody tr:nth-child(-n+25){animation:rowin .35s ease both}
tbody tr:nth-child(2){animation-delay:.02s}tbody tr:nth-child(3){animation-delay:.04s}tbody tr:nth-child(4){animation-delay:.06s}tbody tr:nth-child(5){animation-delay:.08s}tbody tr:nth-child(n+6){animation-delay:.1s}
.modal{animation:pop .28s cubic-bezier(.2,.8,.3,1) both}
.t{animation:tin .3s ease both}
.dn{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.dn svg{width:170px;height:170px;flex:none}
.dn circle.sg{fill:none;stroke-width:22;animation:dn 1s cubic-bezier(.2,.7,.2,1) both;transition:stroke-width .2s}.dn circle.sg:hover{stroke-width:27}
.dn .ctr{fill:var(--ink);font-weight:700;font-size:15px;text-anchor:middle}.dn .ctl{fill:var(--mut);font-size:9px;text-anchor:middle;text-transform:uppercase;letter-spacing:.6px}
.dn .lg{flex:1;min-width:150px;font-size:12.5px}.dn .lg div{display:flex;align-items:center;gap:8px;margin:6px 0}.dn .lg i{width:11px;height:11px;border-radius:3px;flex:none}.dn .lg b{margin-left:auto;font-variant-numeric:tabular-nums}
.btn.sec:hover{box-shadow:0 2px 8px rgba(11,107,92,.2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#side .gh{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;margin-top:6px;border-radius:8px;padding:8px 12px}
#side .gh:hover{background:var(--accbg);color:var(--acc)}#side .gh span{flex:1}
#side .gh em{font-style:normal;font-size:10px;background:var(--accbg);color:var(--acc);border-radius:99px;padding:0 7px;font-weight:700}
#side .gh i{font-style:normal;transition:transform .2s}#side .gh.off i{transform:rotate(-90deg)}
#side .gb{overflow:hidden;max-height:400px;transition:max-height .25s ease,opacity .2s;padding-left:6px;border-left:2px solid var(--line);margin-left:14px}
#side .gb.off{max-height:0;opacity:0}#side .gb a{font-size:13px;padding:7px 10px}

/* ===== v4: UI refresh ===== */
body{background:radial-gradient(1200px 500px at 85% -10%,var(--accbg),transparent 60%),var(--bg);letter-spacing:.1px}
#top{background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(10px);position:relative;z-index:30;border-bottom:1px solid var(--line)}
#top .brand{display:flex;flex-direction:column;line-height:1.15}
#top .brand small{margin-top:1px}
#side{background:linear-gradient(185deg,#06362f 0%,#0b6b5c 100%);border-right:0;padding:14px 10px;scrollbar-width:thin}
#side a{color:#d5ece6;font-weight:500;border-radius:10px;position:relative}
#side a:hover{background:rgba(255,255,255,.1);color:#fff}
#side a.on{background:#fff;color:#0b6b5c;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.22)}
:root[data-theme=dark] #side a.on{background:#fff;color:#0b6b5c}
#side .grp,#side .gh{color:#9fd3c7}#side .gh:hover{background:rgba(255,255,255,.08);color:#fff}
#side .gh em{background:rgba(255,255,255,.14);color:#e6fff8}
#side .gb{border-left-color:rgba(255,255,255,.18)}
#main{padding:22px 28px 70px}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px;padding-left:12px;border-left:4px solid var(--acc);line-height:1.15;margin-bottom:6px}
.sub{max-width:900px}
.card{border-radius:16px;transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 8px 28px rgba(16,34,31,.1)}
.kpi{border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--accbg))}
.kpi:after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--acc);opacity:.08}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.4px}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));border-radius:10px;box-shadow:0 2px 6px rgba(11,107,92,.25)}
.btn.sec{background:var(--accbg);box-shadow:none;border:1px solid transparent}.btn.sec:hover{border-color:var(--acc)}
.btn.bad{background:var(--bad)}
input[type=text],input[type=date],input[type=number],select,textarea,input:not([type]){border-radius:10px;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 25%,transparent)}
.tw{border-radius:14px;box-shadow:var(--sh)}
th{background:linear-gradient(180deg,var(--hd),color-mix(in srgb,var(--hd) 85%,#000));font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:10px 9px}
td{padding:8px 9px}tbody tr{transition:background .12s}
.chip{border-radius:99px;padding:6px 14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh)}
.pill{padding:2px 10px}
.pager{padding:6px 2px}
.dz{background:repeating-linear-gradient(45deg,transparent 0 12px,color-mix(in srgb,var(--accbg) 50%,transparent) 12px 24px)}
#mask{backdrop-filter:blur(4px)}.modal{border-radius:18px}
.t{border-left:4px solid var(--acc2);border-radius:12px}.t.err{border-left-color:#ffb4ab}
#sync{box-shadow:var(--sh)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mut) 40%,transparent);border-radius:99px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box;border:2px solid transparent}
@media(max-width:820px){#main{padding:14px}#top .brand small{display:none}h1{font-size:19px}}
.spk{width:100%;height:28px;margin-top:6px;display:block}.spk polyline{stroke-dasharray:300;stroke-dashoffset:300;animation:dash 1.2s .2s ease forwards}@keyframes dash{to{stroke-dashoffset:0}}
.svgc rect[data-act],.dn circle[data-act]{cursor:pointer}.svgc rect[data-act]:hover{filter:brightness(1.15)}
.card.due{display:flex;align-items:center;gap:12px;background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .ch{text-align:center;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding:2px}
.cd{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;position:relative;display:flex;flex-direction:column;gap:1px;background:var(--panel);transition:transform .15s,box-shadow .15s}
.cd.e{border:0;background:none}.cd b{font-size:12px;color:var(--mut)}.cd span{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}.cd small{font-size:10.5px;color:var(--mut)}
.cd.has{cursor:pointer;background:color-mix(in srgb,var(--c1) calc(var(--i)*30%),var(--panel))}.cd.has:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.cd.has.late{background:color-mix(in srgb,var(--bad) calc(var(--i)*30%),var(--panel))}.cd.has.late span{color:var(--bad)}
.cd.today{border:2px solid var(--c2)}.cd.sel{outline:3px solid var(--acc);outline-offset:-1px}
@media(max-width:820px){.cd{min-height:58px;padding:4px}.cd span{font-size:11px}.cd small{display:none}}
#lock{position:fixed;inset:0;z-index:300;display:flex;background:#052e28;overflow:hidden}#lock.off{display:none}
#lock .bl{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:flt 14s ease-in-out infinite alternate}
#lock .b1{width:420px;height:420px;background:#0f8f7a;left:-100px;top:-80px}#lock .b2{width:360px;height:360px;background:#e08a1e;left:30%;bottom:-140px;opacity:.28;animation-delay:-5s}#lock .b3{width:300px;height:300px;background:#3b6fb6;left:15%;top:40%;opacity:.25;animation-delay:-9s}
@keyframes flt{to{transform:translate(60px,40px) scale(1.15)}}
.lbrand{flex:1.1;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 7vw}
.lmark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);margin-bottom:26px;animation:pop .6s both}
.lbrand h1{border:0;padding:0;font-size:clamp(30px,4.2vw,52px);letter-spacing:2px;line-height:1.05;margin:0 0 12px;font-weight:800;animation:fup .7s .1s both}
.lbrand p{margin:0;color:#a9d9cf;letter-spacing:.5px;animation:fup .7s .2s both}
.lclock{margin-top:44px;animation:fup .7s .3s both}.lclock b{display:block;font-size:42px;font-weight:300;letter-spacing:2px;font-variant-numeric:tabular-nums}.lclock span{color:#a9d9cf;font-size:13px}
.lside{flex:.9;position:relative;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);border-left:1px solid rgba(255,255,255,.12)}

<script>'use strict';
/* ===== helpers ===== */
const TYPES=['CASH','NEFT','UPI','CHQ'];
const EPS=0.005;
const r2=x=>Math.round((x+(x>=0?1e-9:-1e-9))*100)/100;
const clean=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const nk=s=>clean(s).toUpperCase();
const lk=s=>nk(s).replace(/[^A-Z0-9]/g,'');
const ik=s=>String(s==null?'':s).replace(/\s+/g,'').toUpperCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>(n==null||n===''||isNaN(n))?'':nf.format(r2(n));
const fmt0=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(Math.round(n));
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const disp=s=>s?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):'';
const utc=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const dayDiff=(a,b)=>Math.round((utc(b)-utc(a))/864e5);
const addDays=(s,n)=>{const d=new Date(utc(s)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function toISO(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){return isNaN(v)?null:v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate())}
  if(typeof v==='number'){if(v<20000||v>80000)return null;const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  if(m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ,]+(\d{2,4})$/)){const mi=MON.indexOf(m[2].toUpperCase());if(mi<0)return null;let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mi+1)+'-'+pad(+m[1])}
  return null;
}
function num(v){if(v==null||v==='')return null;if(typeof v==='number')return isNaN(v)?null:v;const n=parseFloat(String(v).replace(/[,\s₹]/g,''));return isNaN(n)?null:n}
const serial=s=>s?utc(s)/864e5+25569:null;

/* ===== database ===== */
const DEF_SETTINGS=()=>({openDate:'2026-03-31',fyStart:'2026-04-01',fyEnd:'2027-03-31',creditDays:30,buckets:[30,60,90,120,180],pendingChq:true,theme:'light',fyLabel:'FY 26-27',openLabel:'FY25-26'});
const newDB=()=>({ver:1,company:'EMERALD AGENCIES',settings:DEF_SETTINGS(),parties:{},alias:{},opening:{},sales:[],coll:[],cancelled:[],log:[],seq:1,rev:0});
let DB=newDB();
let _loose=null,_pb=null;
const dirtyParties=()=>{_loose=null;_pb=null};
function looseIdx(){if(_loose)return _loose;_loose={};for(const k in DB.parties){const l=lk(DB.parties[k].name);(_loose[l]=_loose[l]||[]).push(k)}return _loose}
function findParty(name){
  const k=nk(name);if(!k)return null;
  if(DB.alias[k]&&DB.parties[DB.alias[k]])return DB.alias[k];
  if(DB.parties[k])return k;
  const c=looseIdx()[lk(name)];if(c&&c.length===1)return c[0];
  return null;
}
function ensureParty(name){let k=findParty(name);if(k)return k;k=nk(name);let kk=k,i=2;while(DB.parties[kk])kk=k+'#'+i++;DB.parties[kk]={name:clean(name)};dirtyParties();return kk}
const pname=k=>DB.parties[k]?DB.parties[k].name:k;
const bigrams=s=>{const a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.substr(i,2));return a};
const dice=(a,b)=>{let n=0;a.forEach(x=>{if(b.has(x))n++});return 2*n/((a.size+b.size)||1)};
function pbig(){if(_pb)return _pb;_pb={};for(const k in DB.parties)_pb[k]=bigrams(lk(DB.parties[k].name));return _pb}
function suggest(name,n=3,exclude){
  const A=bigrams(lk(name)),PB=pbig(),out=[];
  for(const k in PB){if(k===exclude)continue;const s=dice(A,PB[k]);if(s>=0.62)out.push([k,s])}
  out.sort((a,b)=>b[1]-a[1]);return out.slice(0,n);
}
const bump=()=>{DB.rev++;_cache={};scheduleSave()};

/* ===== data layer (backend: Apps Script Code.gs) ===== */
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwUeb2Je2HE9j1UI-iYUTwVktBg90Wq5bbvfjbz6EU9rfiv6t0j18tOK0rM-_HigCW9KQ/exec';   // <- Apps Script Web app URL (Deploy > Web app)
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const HAS_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
function parseResp(t){try{return JSON.parse(t)}catch(e){throw new Error('Invalid response from server. Check that the web app is deployed with access "Anyone" and WEB_APP_URL is the latest /exec URL.')}}
function gasCall(body){return new Promise((res,rej)=>google.script.run.withSuccessHandler(t=>{try{res(JSON.parse(t))}catch(e){rej(new Error('Invalid response from server'))}}).withFailureHandler(e=>rej(new Error(e&&e.message||String(e)))).api(JSON.stringify(body)))}
async function apiGet(action){
  if(HAS_GAS)return gasCall({action});
  const r=await fetch(WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action='+action+'&t='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);return parseResp(await r.text())}
async function apiPost(body){
  if(HAS_GAS)return gasCall(body);
  const r=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);return parseResp(await r.text())}
let REV=null,LAST={},BAD={sales:[],coll:[],opening:[]},SYNC_READY=false,_saving=false,_st=null,_state='idle',_msg='';
/* what is written to each sheet tab */
const SEC={
  settings(){const S=DB.settings;return [['company',DB.company],['openDate',S.openDate],['fyStart',S.fyStart],['fyEnd',S.fyEnd],['creditDays',S.creditDays],['buckets',S.buckets.join(',')],['pendingChq',S.pendingChq?'TRUE':'FALSE'],['fyLabel',S.fyLabel],['openLabel',S.openLabel]]},
  opening(){return Object.keys(DB.opening).filter(k=>DB.parties[k]&&DB.opening[k]).map(k=>[pname(k),DB.opening[k]])},
  parties(){const r=Object.keys(DB.parties).map(k=>[pname(k),'']);for(const a in DB.alias){const t=DB.alias[a];if(DB.parties[t])r.push([a,pname(t)])}return r},
  sales(){const r=DB.sales.map(s=>[s.date,pname(s.k),s.inv,s.value]);DB.cancelled.forEach(c=>r.push([c.date||'','(cancelled)',c.inv,'']));
    return r.map((x,i)=>[x,i]).sort((p,q)=>(p[0][0]||'')<(q[0][0]||'')?-1:(p[0][0]||'')>(q[0][0]||'')?1:p[1]-q[1]).map(x=>x[0])},
  coll(){return DB.coll.map(c=>{const t=c.type,v=c.value;return [c.date,t,pname(c.k),t==='NEFT'?v:'',t==='CASH'?v:'',t==='UPI'?v:'',t==='UPI'?c.refNo||'':'',t==='CHQ'?v:'',t==='CHQ'?c.refDate||'':'',t==='CHQ'?c.refNo||'':'',c.receipt||'',c.inv||'',c.added||'',t==='NEFT'?c.refNo||'':'',t==='CHQ'?c.status||'':'']})},
  log(){return DB.log.map(l=>[l.at,l.kind,l.note||'',l.added||0,l.dups||0,l.issues||0,l.total||0,l.created||0])}
};
const blocked=k=>(k==='sales'&&BAD.sales.length)||(k==='coll'&&BAD.coll.length)||(k==='opening'&&BAD.opening.length);
function setSync(st,msg){_state=st;_msg=msg||'';const e=$('#sync');if(!e)return;
  const nbad=BAD.sales.length+BAD.coll.length+BAD.opening.length;let cls='',t='';
  if(st==='err'){cls='err';t='⚠ Changes not saved - click to retry'}
  else if(st==='conflict'){cls='err';t='⚠ Data was updated elsewhere - click to refresh'}
  else if(nbad){cls='warn';t='⚠ '+nbad+' data row(s) unreadable - click'}
  e.className=cls;e.textContent=t;e.style.display=t?'':'none';e.title=msg||''}
function scheduleSave(){if(!SYNC_READY)return;setSync('dirty');clearTimeout(_st);_st=setTimeout(flush,900)}
async function flush(){
  clearTimeout(_st);if(_saving||!SYNC_READY)return;
  const sections={},js={};
  for(const k in SEC){if(blocked(k))continue;const rows=SEC[k](),j=JSON.stringify(rows);if(j!==LAST[k]){sections[k]=rows;js[k]=j}}
  if(!Object.keys(sections).length){setSync('ok');return}
  _saving=true;setSync('saving');let again=false;
  try{
    const res=await apiPost({action:'save',baseRev:REV,sections});
    if(res.conflict){_saving=false;setSync('conflict');onConflict();return}
    if(!res.ok)throw new Error(res.error||'Save failed');
    REV=res.rev;for(const k in js)LAST[k]=js[k];setSync('ok');again=true;
  }catch(e){setSync('err',String(e.message||e));toast('Could not save changes: '+(e.message||e),true)}
  _saving=false;if(again)flush();
}
async function onConflict(){
  if(confirm('The data was changed by someone else after you opened it.\n\nOK = load the latest data (your last unsaved change is discarded)\nCancel = stay here (nothing is saved until you refresh)'))await loadFromSheet(false);
}
window.addEventListener('beforeunload',e=>{if(_state==='dirty'||_state==='saving'||_state==='err'){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',()=>{if(_state==='err')flush()});

/* ===== build DB from the sheet ===== */
function tbl(sec){return {headers:sec.headers,rows:sec.rows.map(r=>{const o={n:r.n};sec.headers.forEach((h,i)=>{o[h]=r.v[i]===''?null:r.v[i]});return o})}}
const each=(arr,fn)=>new Promise((res,rej)=>{let i=0;const run=()=>{try{const t0=performance.now();for(;i<arr.length&&performance.now()-t0<10;i++)fn(arr[i],i);if(i<arr.length)setTimeout(run,0);else res()}catch(e){rej(e)}};run()});
async function buildDB(raw){
  const db=newDB();DB=db;dirtyParties();BAD={sales:[],coll:[],opening:[]};
  const st={};tbl(raw.settings).rows.forEach(r=>{if(r['KEY']!=null)st[clean(r['KEY'])]=r['VALUE']});
  const S=DB.settings;
  if(st.company)DB.company=clean(st.company);
  ['openDate','fyStart','fyEnd'].forEach(k=>{const d=toISO(st[k]);if(d)S[k]=d});
  if(num(st.creditDays))S.creditDays=num(st.creditDays);
  if(st.buckets!=null){const b=String(st.buckets).split(/[,\s]+/).map(Number).filter(x=>x>0);if(b.length&&b.every((x,i)=>!i||x>b[i-1]))S.buckets=b}
  if(st.pendingChq!=null)S.pendingChq=/^(true|1|yes)$/i.test(String(st.pendingChq));
  if(st.fyLabel)S.fyLabel=clean(st.fyLabel);if(st.openLabel)S.openLabel=clean(st.openLabel);
  const th=lsGet('ea_theme');if(th)S.theme=th;
  // parties (master list, then aliases)
  const pr=tbl(raw.parties).rows;
  await each(pr,r=>{const nm=clean(r['PARTY NAME']);if(nm&&!clean(r['ALIAS OF'])&&!DB.parties[nk(nm)])DB.parties[nk(nm)]={name:nm}});
  dirtyParties();
  await each(pr,r=>{const nm=clean(r['PARTY NAME']),al=clean(r['ALIAS OF']);if(nm&&al){const t=findParty(al);if(t)DB.alias[nk(nm)]=t}});
  // opening outstanding
  await each(tbl(raw.opening).rows,r=>{const nm=clean(r['PARTY NAME']),v=num(r['VALUE']);
    if(!nm&&v==null)return;if(!nm||v==null){BAD.opening.push('FY25-26_OS row '+r.n+': '+(nm||'(no party)')+' / '+(r['VALUE']==null?'(no value)':r['VALUE']));return}
    let k=DB.parties[nk(nm)]?nk(nm):(DB.alias[nk(nm)]||null);if(!k||!DB.parties[k]){k=nk(nm);DB.parties[k]={name:nm};dirtyParties()}
    DB.opening[k]=r2((DB.opening[k]||0)+v)});
  const resolve=name=>findParty(name)||ensureParty(name);
  // sales (+ cancelled invoices)
  const sl=tbl(raw.sales);
  await each(parseSalesRows(sl.rows),r=>{
    const date=toISO(r.date),party=clean(r.party),inv=clean(r.inv),val=num(r.value);
    if(!party&&!inv&&val==null&&!date)return;
    if(isCancelled(party)||(val==null&&inv&&!party)){if(inv&&!DB.cancelled.some(x=>ik(x.inv)===ik(inv)))DB.cancelled.push({date,inv});return}
    const prob=[];if(!date)prob.push('invalid date');if(!party)prob.push('party missing');if(!inv)prob.push('invoice no. missing');if(val==null)prob.push('invalid value');else if(val===0)prob.push('zero value');
    if(prob.length){BAD.sales.push('SALES row '+r.n+': '+prob.join(', '));return}
    DB.sales.push({id:DB.seq++,date,k:resolve(party),inv,value:val})});
  // collection
  const ct=tbl(raw.coll),upd={};ct.rows.forEach(r=>{upd[r.n]=toISO(r['LAST UPDATED'])});
  await each(parseCollRows(ct),r=>{
    const date=toISO(r.date),party=clean(r.party),val=num(r.value),type=normType(r.type);
    if(!party&&val==null&&!date)return;
    const prob=[];if(!date)prob.push('invalid date');if(!party)prob.push('party missing');if(!type)prob.push('invalid type "'+clean(r.type)+'"');if(val==null||val<=0)prob.push('invalid/zero value');
    if(prob.length){BAD.coll.push('COLLECTION row '+r.n+': '+prob.join(', '));return}
    let status=type==='CHQ'?(nk(r.status)||'CLEARED'):'';if(type==='CHQ'&&!['PENDING','CLEARED','BOUNCED'].includes(status))status='CLEARED';
    DB.coll.push({id:DB.seq++,date,type,k:resolve(party),refDate:toISO(r.refDate),refNo:clean(r.refNo),value:val,receipt:clean(r.receipt),inv:clean(r.inv),status,added:upd[r.n]||''})});
  // import log
  DB.log=tbl(raw.log).rows.map(r=>({at:String(r['AT']||''),kind:r['KIND']||'',note:r['NOTE']||'',added:num(r['ADDED'])||0,dups:num(r['DUPS'])||0,issues:num(r['ISSUES'])||0,total:num(r['TOTAL'])||0,created:num(r['CREATED'])||0})).slice(0,200);
  dirtyParties();_cache={};
  LAST={};for(const k in SEC)LAST[k]=JSON.stringify(SEC[k]());
  if(!raw.parties.rows.length)LAST.parties=null;      // first run: create PARTY MASTER
  if(!raw.settings.rows.length)LAST.settings=null;    // first run: create SETTINGS
}
function showSetup(){$('#view').innerHTML='<div class="card"><h1>Setup required</h1><div class="sub">The backend address is not configured. Paste the deployed web app URL into WEB_APP_URL near the top of the data section of this file, then reopen it.</div></div>';setSync('err','WEB_APP_URL not set')}

async function archiveSheets(){try{const r=await apiPost({action:'archive'});if(!r.ok)throw new Error(r.error);return true}catch(e){return confirm('Could not create a backup copy ('+(e.message||e)+').\n\nContinue anyway?')}}

/* ===== allocation engine ===== */
let _cache={};
const recIncluded=r=>r.type!=='CHQ'||!r.status||r.status==='CLEARED'||(r.status==='PENDING'&&DB.settings.pendingChq);
function bucketLabels(){const B=DB.settings.buckets;const L=[];let prev=0;B.forEach((b,i)=>{L.push(i===0?'0-'+b:(prev+1)+'-'+b);prev=b});L.push(prev+'+');return L}
function bucketOf(days){const B=DB.settings.buckets;for(let i=0;i<B.length;i++)if(days<=B[i])return i;return B.length}
function compute(asOn){
  const key=asOn+'|'+DB.settings.pendingChq+'|'+DB.settings.openDate;
  if(_cache[key])return _cache[key];
  const S=DB.settings,nb=S.buckets.length+1,P={},billByInv={},recInfo={};
  const get=k=>P[k]||(P[k]={k,name:pname(k),bills:[],recs:[],adv0:0,open:0,sales:0,coll:0,cn:0});
  Object.keys(DB.parties).forEach(k=>get(k));
  Object.keys(DB.opening).forEach(k=>{const v=DB.opening[k];if(!DB.parties[k]||!v)return;const p=get(k);p.open=v;
    if(v>0)p.bills.push({inv:'OPENING B/F',date:S.openDate,amt:v,bal:v,open:true,alloc:[],k});else p.adv0=-v});
  DB.sales.forEach(s=>{if(s.date>asOn||!DB.parties[s.k])return;const p=get(s.k);
    if(s.value>=0){const b={inv:s.inv,date:s.date,amt:s.value,bal:s.value,alloc:[],k:s.k,id:s.id};p.bills.push(b);p.sales+=s.value;if(!billByInv[ik(s.inv)])billByInv[ik(s.inv)]=b}
    else{p.recs.push({id:'S'+s.id,date:s.date,type:'CN',value:-s.value,inv:'',cn:true,k:s.k});p.cn+=-s.value}});
  DB.coll.forEach(c=>{if(c.date>asOn||!DB.parties[c.k])return;if(!recIncluded(c))return;get(c.k).recs.push({id:c.id,date:c.date,type:c.type,value:c.value,inv:c.inv||'',k:c.k});get(c.k).coll+=c.value});
  const tot={open:0,sales:0,coll:0,net:0,adv:0,b:new Array(nb).fill(0),overdue:0};
  Object.keys(P).forEach(k=>{
    const p=P[k];p.bills.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.open?-1:b.open?1:0));
    p.recs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
    const idx={};p.bills.forEach(b=>{const x=ik(b.inv);if(!idx[x])idx[x]=b});
    const pool=[];p.unmatched=[];
    if(p.adv0>0)pool.push({rec:{id:'OPEN',date:S.openDate,type:'OPENING CR',value:p.adv0,k},amt:p.adv0});
    // phase 1: invoice-specific
    for(const r of p.recs){
      r.rem=r.value;r.alloc=[];r.bad=[];
      const raw=clean(r.inv);
      if(raw){let refs;if(idx[ik(raw)])refs=[ik(raw)];else refs=raw.split(/[,;&\n]+|\s+/).map(ik).filter(Boolean);
        for(const ref of refs){const b=idx[ref];if(!b){r.bad.push(ref);continue}
          const t=Math.min(r.rem,b.bal);if(t>EPS){b.bal=r2(b.bal-t);r.rem=r2(r.rem-t);b.alloc.push({rec:r,amt:t,ph:1});r.alloc.push({bill:b,amt:t,ph:1})}}
        if(r.bad.length)p.unmatched.push(r)}
    }
    // phase 2: FIFO on bills dated <= receipt date
    for(const r of p.recs){if(r.rem<=EPS)continue;
      for(const b of p.bills){if(r.rem<=EPS)break;if(b.bal<=EPS||b.date>r.date)continue;
        const t=Math.min(r.rem,b.bal);b.bal=r2(b.bal-t);r.rem=r2(r.rem-t);b.alloc.push({rec:r,amt:t,ph:2});r.alloc.push({bill:b,amt:t,ph:2})}
      if(r.rem>EPS)pool.push({rec:r,amt:r.rem})}
    // phase 3: leftover credit against any remaining (later) bills
    for(const b of p.bills){if(b.bal<=EPS)continue;
      for(const q of pool){if(q.amt<=EPS)continue;const t=Math.min(q.amt,b.bal);b.bal=r2(b.bal-t);q.amt=r2(q.amt-t);
        b.alloc.push({rec:q.rec,amt:t,ph:3});if(q.rec.alloc)q.rec.alloc.push({bill:b,amt:t,ph:3})}}
    p.adv=0;for(const q of pool){if(q.amt>EPS){p.adv=r2(p.adv+q.amt);q.rec.advance=q.amt}}
    p.b=new Array(nb).fill(0);p.overdue=0;p.oldest=null;p.outBills=0;
    for(const b of p.bills){if(b.bal>EPS){const d=dayDiff(b.date,asOn);b.days=d;b.bkt=bucketOf(d);p.b[b.bkt]=r2(p.b[b.bkt]+b.bal);p.outBills=r2(p.outBills+b.bal);
      if(d>S.creditDays)p.overdue=r2(p.overdue+b.bal);if(!p.oldest||b.date<p.oldest)p.oldest=b.date}
      else{b.days=dayDiff(b.date,asOn);b.bkt=-1}}
    p.net=r2(p.outBills-p.adv);
    p.last=null;for(const r of p.recs)if(!r.cn&&(!p.last||r.date>p.last))p.last=r.date;
    p.oldestDays=p.oldest?dayDiff(p.oldest,asOn):null;
    tot.open=r2(tot.open+p.open);tot.sales=r2(tot.sales+p.sales);tot.coll=r2(tot.coll+p.coll+p.cn);tot.net=r2(tot.net+p.net);tot.adv=r2(tot.adv+p.adv);tot.overdue=r2(tot.overdue+p.overdue);
    p.b.forEach((v,i)=>tot.b[i]=r2(tot.b[i]+v));
    for(const r of p.recs)recInfo[r.id]=r;
  });
  return _cache[key]={P,tot,billByInv,recInfo,asOn};
}

/* ===== ledger ===== */
function buildLedger(k,from,to){
  const S=DB.settings,rows=[];
  const op=DB.opening[k]||0;
  if(op)rows.push({date:S.openDate,ord:0,kind:'OB',part:'Opening Balance B/F ('+S.openLabel+')',ref:'',dr:op>0?op:0,cr:op<0?-op:0});
  for(const s of DB.sales){if(s.k!==k||s.date>to)continue;
    if(s.value>=0)rows.push({date:s.date,ord:1,kind:'SALE',part:'Sales Invoice',ref:s.inv,dr:s.value,cr:0,id:s.id});
    else rows.push({date:s.date,ord:2,kind:'CN',part:'Credit Note',ref:s.inv,dr:0,cr:-s.value,id:s.id})}
  for(const c of DB.coll){if(c.k!==k||c.date>to)continue;const inc=recIncluded(c);
    let part='Receipt - '+c.type+(c.type==='CHQ'&&c.status&&c.status!=='CLEARED'?' ('+c.status+')':'');
    const refs=[];if(c.refNo)refs.push(c.type==='CHQ'?'Chq '+c.refNo:c.type==='UPI'?'Txn '+c.refNo:c.type==='NEFT'?'UTR '+c.refNo:c.refNo);
    if(c.receipt)refs.push('Rcpt '+c.receipt);if(c.inv)refs.push('Against '+c.inv);
    rows.push({date:c.date,ord:2,kind:'REC',part,ref:refs.join(' | '),dr:0,cr:inc?c.value:0,id:c.id,memo:!inc})}
  rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ord-b.ord);
  let bal=0,openBal=0;const out=[];
  for(const r of rows){
    if(r.date<from){bal=r2(bal+r.dr-r.cr);continue}
    out.push(r)}
  openBal=bal;
  const res=[];let run=openBal,dr=0,cr=0;
  if(from>S.openDate||openBal)res.push({date:from,kind:'BF',part:'Balance Brought Forward',ref:'',dr:0,cr:0,bal:openBal,isBF:true});
  for(const r of out){run=r2(run+r.dr-r.cr);dr=r2(dr+r.dr);cr=r2(cr+r.cr);res.push({...r,bal:run})}
  return {rows:res,open:openBal,dr,cr,close:run};
}

/* ===== import parsing ===== */
function sheetObjs(ws){
  const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  return a;
}
function findTable(wb,needs){
  for(const sn of wb.SheetNames){const a=sheetObjs(wb.Sheets[sn]);
    for(let i=0;i<Math.min(a.length,12);i++){const h=(a[i]||[]).map(x=>nk(x));
      if(needs.every(n=>h.includes(n))){const rows=[];
        for(let j=i+1;j<a.length;j++){const o={n:j+1};let any=false;(a[j]||[]).forEach((v,c)=>{if(h[c]){o[h[c]]=v;if(v!=null&&v!=='')any=true}});if(any)rows.push(o)}
        return {sheet:sn,headers:h,rows}}}}
  return null;
}
const normType=t=>{const s=nk(t);if(TYPES.includes(s))return s;if(/^CHE?Q|CHECK/.test(s))return 'CHQ';if(/RTGS|IMPS|NEFT|ONLINE|BANK|TRANSFER/.test(s))return 'NEFT';if(/UPI|GPAY|PHONEPE|PAYTM|GOOGLE/.test(s))return 'UPI';if(/CASH/.test(s))return 'CASH';return null};
const isCancelled=(p)=>/^\(?\s*cancel/i.test(clean(p));

function parseSalesRows(rows){
  return rows.map(r=>({n:r.n,date:r['DATE'],party:r['PARTY']!=null?r['PARTY']:r['PARTY NAME'],inv:r['INV NO.']!=null?r['INV NO.']:r['INV NO'],value:r['VALUE']}));
}
function parseCollRows(tab){
  const out=[],H=tab.headers,wide=H.includes('NEFT VALUE')||H.includes('CASH VALUE')||H.includes('UPI VALUE')||H.includes('CHQ VALUE');
  for(const r of tab.rows){
    if(!wide){out.push({n:r.n,date:r['DATE'],type:r['TYPE'],party:r['PARTY NAME']!=null?r['PARTY NAME']:r['PARTY'],refDate:r['REF DATE'],refNo:r['REF NO.']!=null?r['REF NO.']:r['REF NO'],value:r['VALUE'],receipt:r['RECEIPT NO.'],inv:r['AGAINST INV.'],status:r['CHQ STATUS']})}
    else{
      const base={n:r.n,date:r['DATE'],party:r['PARTY NAME'],receipt:r['RECEIPT NO.'],inv:r['AGAINST INV.']};
      const tp=nk(r['TYPE']);let any=false;
      const add=(type,val,refNo,refDate,st)=>{if(num(val)){any=true;out.push({...base,type,value:val,refNo,refDate,status:st})}};
      add('NEFT',r['NEFT VALUE'],r['NEFT UTR NO.']);add('CASH',r['CASH VALUE']);add('UPI',r['UPI VALUE'],r['UPI TXN NO.']);add('CHQ',r['CHQ VALUE'],r['CHQ NO.'],r['CHQ DATE'],r['CHQ STATUS']);
      if(!any&&(base.party||base.date))out.push({...base,type:tp||'CASH',value:null})}
  }
  return out;
}
/* validate & classify. returns plan; does not mutate DB */
function planSales(rows,opts={}){
  const plan={kind:'sales',ok:[],issues:[],dups:[],cancelled:[],unknown:{},total:0};
  const exist=new Map();for(const s of DB.sales)exist.set(ik(s.inv),s);
  const canc=new Set(DB.cancelled.map(c=>ik(c.inv)));const seen=new Map();
  for(const r of rows){
    const date=toISO(r.date),party=clean(r.party),inv=clean(r.inv),val=num(r.value);
    if(!party&&!inv&&val==null&&!date)continue;
    if(isCancelled(party)||(val==null&&inv&&!party)){if(inv)plan.cancelled.push({date,inv});continue}
    const prob=[];if(!date)prob.push('Invalid date');if(!party)prob.push('Party missing');if(!inv)prob.push('Invoice no. missing');if(val==null)prob.push('Invalid value');else if(val===0)prob.push('Zero value');
    if(prob.length){plan.issues.push({n:r.n,msg:prob.join(', '),d:[disp(date),party,inv,val].join(' / ')});continue}
    const x=ik(inv),e=exist.get(x)||seen.get(x);
    if(e){const same=Math.abs(e.value-val)<EPS;plan.dups.push({n:r.n,inv,party,val,same,msg:same?'Duplicate - already present':'Conflict - same invoice no. with different value ('+fmt(e.value)+')'});continue}
    const row={date,party,inv,value:val,n:r.n};seen.set(x,row);plan.ok.push(row);plan.total=r2(plan.total+val);
    if(!findParty(party)){const u=plan.unknown[nk(party)]=plan.unknown[nk(party)]||{name:clean(party),count:0,value:0};u.count++;u.value+=val}
  }
  return plan;
}
function planColl(rows,opts={}){
  const plan={kind:'coll',ok:[],issues:[],dups:[],unknown:{},total:0};
  const keyOf=(c)=>[c.date,c.k||nk(c.party),c.type,c.value,nk(c.receipt),nk(c.refNo)].join('|');
  const exist=new Set(DB.coll.map(c=>keyOf(c)));const seen=new Set();
  for(const r of rows){
    const date=toISO(r.date),party=clean(r.party),val=num(r.value),type=normType(r.type);
    if(!party&&val==null&&!date)continue;
    const prob=[];if(!date)prob.push('Invalid date');if(!party)prob.push('Party missing');if(!type)prob.push('Invalid type "'+clean(r.type)+'"');if(val==null||val<=0)prob.push('Invalid value');
    if(prob.length){plan.issues.push({n:r.n,msg:prob.join(', '),d:[disp(date),party,r.type,val].join(' / ')});continue}
    const pk=findParty(party);
    const row={date,type,party,value:val,refNo:clean(r.refNo),refDate:toISO(r.refDate),receipt:clean(r.receipt),inv:clean(r.inv),status:type==='CHQ'?(nk(r.status)||'CLEARED'):'',n:r.n};
    if(type==='CHQ'&&!['PENDING','CLEARED','BOUNCED'].includes(row.status))row.status='CLEARED';
    const kk=[date,pk||nk(party),type,val,nk(row.receipt),nk(row.refNo)].join('|');
    if(exist.has(kk)||seen.has(kk)){plan.dups.push({n:r.n,inv:row.inv,party,val,same:true,msg:'Duplicate - already present'});continue}
    seen.add(kk);plan.ok.push(row);plan.total=r2(plan.total+val);
    if(!pk){const u=plan.unknown[nk(party)]=plan.unknown[nk(party)]||{name:clean(party),count:0,value:0};u.count++;u.value+=val}
  }
  return plan;
}
/* commit plan. map: normalized unknown name -> party key | '__new__' */
function commitPlan(plan,map,note){
  map=map||{};let created=0;
  const resolve=name=>{const k=findParty(name);if(k)return k;const m=map[nk(name)];
    if(m&&m!=='__new__'&&DB.parties[m]){DB.alias[nk(name)]=m;return m}
    const before=Object.keys(DB.parties).length;const kk=ensureParty(name);if(Object.keys(DB.parties).length>before)created++;return kk};
  if(plan.kind==='sales'){
    for(const r of plan.ok)DB.sales.push({id:DB.seq++,date:r.date,k:resolve(r.party),inv:r.inv,value:r.value});
    for(const c of plan.cancelled)if(!DB.cancelled.some(x=>ik(x.inv)===ik(c.inv)))DB.cancelled.push(c);
  }else{
    for(const r of plan.ok)DB.coll.push({id:DB.seq++,date:r.date,type:r.type,k:resolve(r.party),refDate:r.refDate,refNo:r.refNo,value:r.value,receipt:r.receipt,inv:r.inv,status:r.status,added:todayISO()});
  }
  DB.log.unshift({at:new Date().toISOString(),kind:plan.kind==='sales'?'Sales import':'Collection import',note:note||'',added:plan.ok.length,dups:plan.dups.length,issues:plan.issues.length,total:plan.total,created});
  DB.log=DB.log.slice(0,200);dirtyParties();bump();return {created};
}
/* full DB load (opening + sales + collection) */
function loadFull(wb,replace){
  const res={};
  const os=findTable(wb,['PARTY NAME','VALUE']),sl=findTable(wb,['DATE','PARTY','INV NO.']);
  let co=findTable(wb,['DATE','PARTY NAME','TYPE']);
  if(replace){const keep={company:DB.company,settings:DB.settings};DB=newDB();DB.company=keep.company;DB.settings=keep.settings}
  if(os){let n=0,t=0;for(const r of os.rows){const nm=clean(r['PARTY NAME']),v=num(r['VALUE']);if(!nm||v==null)continue;
      let k=DB.parties[nk(nm)]?nk(nm):(DB.alias[nk(nm)]||null);if(!k||!DB.parties[k]){k=nk(nm);DB.parties[k]={name:clean(nm)};dirtyParties()}DB.opening[k]=r2((DB.opening[k]||0)+v);n++;t+=v}res.os={n,t:r2(t)}}
  if(sl){const p=planSales(parseSalesRows(sl.rows));const m=commitPlan(p,{}, 'Database load');res.sales={n:p.ok.length,t:p.total,dups:p.dups.length,issues:p.issues.length,canc:p.cancelled.length,parties:m.created}}
  if(co&&co.rows.length){const p=planColl(parseCollRows(co));const m=commitPlan(p,{}, 'Database load');res.coll={n:p.ok.length,t:p.total,dups:p.dups.length,issues:p.issues.length}}
  dirtyParties();bump();return res;
}

<script>'use strict';

/* party picker (autocomplete) */
function partyPicker(inp,onPick){
  let box=null,items=[],sel=-1;
  const close=()=>{if(box){box.remove();box=null}};
  const show=()=>{
    const q=nk(inp.value);close();if(!q)return;
    const toks=q.split(' ');items=[];
    for(const k in DB.parties){const n=nk(DB.parties[k].name);if(toks.every(t=>n.includes(t))){items.push(k);if(items.length>=14)break}}
    if(!items.length)return;
    box=document.createElement('div');box.className='ac';const r=inp.getBoundingClientRect();
    box.style.left=r.left+scrollX+'px';box.style.top=r.bottom+scrollY+2+'px';box.style.minWidth=Math.max(260,r.width)+'px';
    box.innerHTML=items.map((k,i)=>'<div data-i="'+i+'">'+esc(pname(k))+'</div>').join('');sel=-1;
    box.onmousedown=e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(items[+d.dataset.i])}};
    document.body.appendChild(box)};
  const pick=k=>{inp.value=pname(k);inp.dataset.k=k;close();onPick&&onPick(k)};
  inp.addEventListener('input',()=>{inp.dataset.k='';show()});

    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+els.length)%els.length;els.forEach((x,i)=>x.classList.toggle('on',i===sel))}
    else if(e.key==='Enter'){e.preventDefault();pick(items[sel>=0?sel:0])}else if(e.key==='Escape')close()});
}

/* ===== generic report table ===== */
/* col: {t:title,get:(r)=>raw,type:'t'|'n'|'d',tot:bool,html:(r)=>html,cls,sort:bool} */

function xlsxFromRep(rep,title,sub){
  const cols=rep.cols.filter(c=>c.t!==''),rows=rep._sorted||rep.rows;
  const A=[[{v:DB.company,s:{font:{bold:true,sz:14}}}],[{v:title,s:{font:{bold:true,sz:12}}}],[{v:sub||'',s:{font:{italic:true,color:{rgb:'555555'}}}}],[]];
  A.push(cols.map(c=>({v:c.t,t:'s',s:HDR})));
  rows.forEach((r,ri)=>A.push(cols.map(c=>{const v=c.t==='#'?ri+1:c.get(r);
    if(c.type==='n')return v==null||v===''?{v:'',t:'s'}:(c.int?{v:+v,t:'n',z:'0'}:{v:+v,t:'n',z:'#,##0.00',s:{numFmt:'#,##0.00'}});
    if(c.type==='d')return v?{v:serial(v),t:'n',z:'dd-mm-yyyy',s:{numFmt:'dd-mm-yyyy'}}:{v:'',t:'s'};
    return {v:v==null?'':v,t:typeof v==='number'?'n':'s'}})));
  if(rep.totals!==false&&cols.some(c=>c.tot)){
    A.push(cols.map((c,i)=>c.tot?{v:r2(rows.reduce((a,r)=>a+(+c.get(r)||0),0)),t:'n',z:'#,##0.00',s:{font:{bold:true},numFmt:'#,##0.00',fill:{fgColor:{rgb:'E4F3EF'}}}}:{v:i===0?'TOTAL':'',t:'s',s:{font:{bold:true},fill:{fgColor:{rgb:'E4F3EF'}}}}))}
  const ws=XLSX.utils.aoa_to_sheet(A);
  ws['!cols']=cols.map((c,i)=>{let w=c.t.length+2;rows.slice(0,300).forEach(r=>{const v=c.get(r);const l=c.type==='n'?14:c.type==='d'?11:String(v==null?'':v).length;if(l+2>w)w=l+2});return {wch:Math.min(Math.max(w,8),48)}});
  ws['!freeze']={xSplit:0,ySplit:5};ws['!views']=[{state:'frozen',ySplit:5}];
  return ws;
}

function pdfTable(doc,rep,rows,startY,opts={}){

  let foot;if(rep.totals!==false&&cols.some(c=>c.tot)){foot=[cols.map((c,i)=>c.tot?fmt(rows.reduce((a,r)=>a+(+c.get(r)||0),0)):(i===0?'TOTAL':''))]}
  const cs={};cols.forEach((c,i)=>{if(c.type==='n')cs[i]={halign:'right'};if(c.pw)cs[i]=Object.assign(cs[i]||{},{cellWidth:c.pw})});
  doc.autoTable({head,body,foot,startY,theme:'grid',margin:{left:14,right:14,top:30,bottom:12},styles:{fontSize:opts.fs||7.5,cellPadding:1.4,lineColor:[210,220,216],lineWidth:.15,overflow:'linebreak'},

function barChart(data,series,h=220){
  // data: [{l:'Apr',v:[a,b]}], series:[{n,c}]
  const W=560,pl=52,pb=26,pt=10,pr=8,iw=W-pl-pr,ih=h-pb-pt;const mx=Math.max(1,...data.flatMap(d=>d.v));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(mx)));const f=mx/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p})();
  const ax=v=>v>=1e7?(v/1e7).toFixed(v%1e7?1:0)+'Cr':v>=1e5?(v/1e5).toFixed(v%1e5?1:0)+'L':v>=1e3?(v/1e3)+'k':v;
  let s='<svg class="svgc" viewBox="0 0 '+W+' '+h+'" width="100%" role="img">';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+ax(nice*i/4)+'</text>'}
  const gw=iw/data.length,bw=Math.min(34,gw*.7/series.length);
  data.forEach((d,i)=>{const x0=pl+gw*i+(gw-bw*series.length)/2;
    d.v.forEach((v,j)=>{const bh=ih*v/nice;s+='<rect '+(d.go?'data-act="chart" data-p="'+d.go[0]+'" data-pr="'+esc(JSON.stringify(d.go[1]||{}))+'" ':'')+'x="'+(x0+j*bw)+'" y="'+(pt+ih-bh)+'" width="'+(bw-2)+'" height="'+bh+'" rx="3" fill="'+series[j].c+'"><title>'+d.l+' - '+series[j].n+': '+fmt0(v)+'</title></rect>'});
    s+='<text x="'+(pl+gw*i+gw/2)+'" y="'+(h-8)+'" text-anchor="middle">'+d.l+'</text>'});
  s+='</svg>';
  if(series.length>1)s+='<div class="small mut" style="display:flex;gap:14px">'+series.map(x=>'<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+x.c+'"></span> '+x.n+'</span>').join('')+'</div>';
  return s;
}

function inWords(n){n=Math.round(n);if(!n)return 'Zero';const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?o[x]:t[Math.floor(x/10)]+(x%10?' '+o[x%10]:'');const three=x=>(x>=100?o[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const p=[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']];let r='';p.forEach(([d,w])=>{const q=Math.floor(n/d);if(q){r+=(q<100?two(q):three(q))+' '+w+' ';n%=d}});if(n)r+=three(n);return r.trim()}
function voucherPage(doc,c,first){
  if(!first)doc.addPage();const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),party=pname(c.k);
  pdfHead(doc,'RECEIPT VOUCHER',null,W);
  const bal=(()=>{const P=compute(c.date).P[c.k];return P?P.net:null})(),L=(x,y,t,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?11:10);doc.setTextColor(b?20:70);doc.text(t,x,y)};
  doc.setDrawColor(210,220,216);doc.setLineWidth(.3);doc.roundedRect(14,32,W-28,H-64,3,3);
  L(20,44,'Voucher / Receipt No.');L(78,44,c.receipt||('V-'+c.id),true);L(W-70,44,'Date');L(W-52,44,disp(c.date),true);
  L(20,57,'Received with thanks from');L(20,65,'M/s '+party,true);
  doc.setFillColor(228,243,239);doc.roundedRect(20,73,W-40,22,2,2,'F');doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text('AMOUNT RECEIVED',26,80);
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(11,107,92);doc.text('Rs. '+fmt(c.value),26,90);
  doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(60);doc.text('Rupees '+inWords(c.value)+' Only',W-26,90,{align:'right'});
  let y=106;const row=(a,b)=>{if(!b)return;L(20,y,a);L(70,y,String(b),true);y+=8};
  row('Mode of payment',c.type==='CHQ'?'Cheque':c.type);row('Cheque / UTR / Ref No.',c.refNo);row('Ref date',c.refDate?disp(c.refDate):'');row('Against invoice(s)',c.inv);
  if(c.type==='CHQ'&&c.status&&c.status!=='CLEARED')row('Cheque status',c.status+' (subject to realisation)');
  if(bal!=null)row('Balance outstanding as on '+disp(c.date),fmt(bal)+(bal<-EPS?' Cr':' Dr'));
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(30);doc.text('For '+DB.company,W-20,H-52,{align:'right'});
  doc.setDrawColor(90);doc.line(W-70,H-40,W-20,H-40);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text('Authorised Signatory',W-20,H-35,{align:'right'});
  doc.setFontSize(7.5);doc.text('This is a computer generated receipt voucher.',20,H-35)}
function exportVouchers(list,name){if(!list.length)return toast('No receipts to print',true);if(list.length>200&&!confirm(list.length+' vouchers will be generated. Continue?'))return;
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a5',compress:true});
  list.forEach((c,i)=>voucherPage(doc,c,i===0));pdfFoot(doc);doc.save(name);toast(list.length+' voucher(s) downloaded')}

PAGES.cal=v=>{
  const f=UI.f.cal=UI.f.cal||{};if(!f.m)f.m=UI.asOn.slice(0,7);const cd=DB.settings.creditDays,C=compute(UI.asOn),bills=[];
  Object.values(C.P).forEach(p=>p.bills.forEach(b=>{if(b.bal>EPS)bills.push({k:p.k,name:p.name,inv:b.inv,date:b.date,due:addDays(b.date,cd),amt:b.amt,bal:b.bal,late:dayDiff(addDays(b.date,cd),UI.asOn)})}));
  const by={};bills.forEach(b=>{const d=by[b.due]||(by[b.due]={n:0,amt:0});d.n++;d.amt+=b.bal});
  const y=+f.m.slice(0,4),m=+f.m.slice(5),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),start=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,mx=Math.max(1,...Object.values(by).map(d=>d.amt));
  const mm=bills.filter(b=>b.due.slice(0,7)===f.m),over=bills.filter(b=>b.due<UI.asOn),wk=bills.filter(b=>b.due>=UI.asOn&&b.due<=addDays(UI.asOn,7)),sum=a=>r2(a.reduce((x,b)=>x+b.bal,0));
  let cells='';for(let i=0;i<start;i++)cells+='<div class="cd e"></div>';

<script>'use strict';
/* ===== statements (PDF) ===== */
function stmtParty(doc,k,from,to,first){
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  if(!first)doc.addPage();
  const L=buildLedger(k,from,to),C=compute(to),p=C.P[k];
  const head=()=>{pdfHead(doc,'Statement of Account',null,W);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(30);doc.text(pname(k),14,24);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(90);doc.text('Period: '+disp(from)+' to '+disp(to),W-14,24,{align:'right'})};
  const body=L.rows.map(r=>[disp(r.date),r.part,r.ref,r.dr?fmt(r.dr):'',r.cr?fmt(r.cr):'',fmt(Math.abs(r.bal))+(r.bal<-EPS?' Cr':r.bal>EPS?' Dr':'')]);
  doc.autoTable({head:[['Date','Particulars','Reference','Debit','Credit','Balance']],body,foot:[['','','Total',fmt(L.dr),fmt(L.cr),fmt(Math.abs(L.close))+(L.close<-EPS?' Cr':' Dr')]],startY:30,theme:'grid',margin:{left:14,right:14,top:30,bottom:12},
    styles:{fontSize:7.5,cellPadding:1.4,lineColor:[210,220,216],lineWidth:.15},headStyles:{fillColor:[11,107,92],textColor:255},footStyles:{fillColor:[228,243,239],textColor:20,fontStyle:'bold'},alternateRowStyles:{fillColor:[248,250,249]},
    columnStyles:{0:{cellWidth:20},3:{halign:'right',cellWidth:24},4:{halign:'right',cellWidth:24},5:{halign:'right',cellWidth:28}},showFoot:'lastPage',
    didParseCell:d=>{if(d.section==='head'&&d.column.index>=3)d.cell.styles.halign='right'},didDrawPage:head});
  const open=p?p.bills.filter(b=>b.bal>EPS&&b.date<=to):[];
  if(open.length||(p&&p.adv>EPS)){
    let y=doc.lastAutoTable.finalY+7;if(y>H-50){doc.addPage();y=32}
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(11,107,92);doc.text('Outstanding bills as on '+disp(to),14,y);
    const rows=open.map(b=>[b.inv,disp(b.date),fmt(b.amt),fmt(b.amt-b.bal),fmt(b.bal),String(b.days)]);
    if(p.adv>EPS)rows.push(['Advance / unadjusted receipts','','','',fmt(-p.adv),'']);
    doc.autoTable({head:[['Invoice No.','Date','Bill Amount','Received','Balance','Days']],body:rows,foot:[['Net outstanding','','','',fmt(p.net),'']],startY:y+2,theme:'grid',margin:{left:14,right:14,top:30,bottom:12},styles:{fontSize:7.5,cellPadding:1.3,lineColor:[210,220,216],lineWidth:.15},headStyles:{fillColor:[60,110,100],textColor:255},footStyles:{fillColor:[228,243,239],textColor:20,fontStyle:'bold'},
      columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}},didParseCell:d=>{if(d.section==='head'&&d.column.index>=2)d.cell.styles.halign='right'},didDrawPage:head,showFoot:'lastPage'});
    const L2=bucketLabels();let y2=doc.lastAutoTable.finalY+5;if(y2>H-20){doc.addPage();y2=32}
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(70);doc.text('Aging: '+L2.map((l,i)=>l+'d: '+fmt(p.b[i])).join('   |   '),14,y2);
  }
}
async function makeStatements(keys,from,to,fname){
  if(!keys.length){toast('No parties to print',true);return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  const m=modal('<h2>Preparing statements...</h2><div id="prg" class="mut">0 / '+keys.length+'</div>');

}

/* ===== import ===== */
async function startImport(kind,file){
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array'})}catch(e){toast('Cannot read file: '+e.message,true);return}
  if(kind==='db'){
    const hasOS=!!findTable(wb,['PARTY NAME','VALUE']),hasS=!!findTable(wb,['DATE','PARTY','INV NO.']),hasC=!!findTable(wb,['DATE','PARTY NAME','TYPE']);
    if(!hasOS&&!hasS&&!hasC){toast('No recognisable sheets found (need PARTY NAME/VALUE, DATE/PARTY/INV NO. or the collection headers)',true);return}
    const m=modal('<h2>Import database</h2><div class="sub">Found: '+[hasOS&&'Outstanding sheet',hasS&&'Sales sheet',hasC&&'Collection sheet'].filter(Boolean).join(', ')+'</div><label><input type="radio" name="dm" value="r" checked> <b>Replace</b> all current data with this file</label><br><label><input type="radio" name="dm" value="m"> <b>Merge</b> into current data (opening balances are added; duplicate invoices / receipts skipped)</label><div class="acts"><button class="btn sec" data-act="close">Cancel</button><button class="btn" id="dgo">Import</button></div>');
    $('#dgo').onclick=()=>{const rep=$('input[name=dm]:checked').value==='r';const r=loadFull(wb,rep);closeModal();
      toast('Imported'+(r.os?' '+r.os.n+' opening balances;':'')+(r.sales?' '+r.sales.n+' invoices;':'')+(r.coll?' '+r.coll.n+' receipts':''));go('dash')};
    return;
  }
  let tab,plan;
  if(kind==='sales'){tab=findTable(wb,['DATE','INV NO.'])||findTable(wb,['DATE','INV NO']);if(!tab){toast('Sales sheet not found. Headers needed: DATE, PARTY, INV NO., VALUE',true);return}plan=planSales(parseSalesRows(tab.rows))}
  else{tab=findTable(wb,['DATE','PARTY NAME','TYPE']);if(!tab){toast('Collection sheet not found. Headers needed: DATE, TYPE, PARTY NAME, ... VALUE',true);return}plan=planColl(parseCollRows(tab))}
  showPlan(plan,file.name);
}
function showPlan(plan,fname){
  const unk=Object.entries(plan.unknown);
  unk.forEach(([k,u])=>{u.sug=suggest(u.name,3)});
  const sel1=(k,u)=>'<select data-un="'+esc(k)+'" style="max-width:340px"><option value="__new__">Create new party</option>'+u.sug.map(s=>'<option value="'+esc(s[0])+'">Map to: '+esc(pname(s[0]))+' ('+Math.round(s[1]*100)+'%)</option>').join('')+'</select>';
  const m=modal('<h2>Review '+(plan.kind==='sales'?'sales':'collection')+' import</h2><div class="sub">'+esc(fname)+'</div>'+
    chips([['Ready to import',plan.ok.length],['Value',fmt(plan.total)],['Duplicates skipped',plan.dups.length],['Rejected rows',plan.issues.length],...(plan.kind==='sales'?[['Cancelled invoices',plan.cancelled.length]]:[])])+
    (unk.length?'<h2>Unknown parties ('+unk.length+')</h2><div class="small mut">These names are not in Party Master. Map to an existing party if it is just a spelling difference, otherwise a new party is created.</div><div style="max-height:240px;overflow:auto;margin:8px 0"><table><thead><tr><th>Name in file</th><th class="n">Entries</th><th>Action</th></tr></thead><tbody>'+unk.slice(0,300).map(([k,u])=>'<tr><td class="w">'+esc(u.name)+'</td><td class="n">'+u.count+'</td><td>'+sel1(k,u)+'</td></tr>').join('')+'</tbody></table></div><button class="btn sec sm" id="mapall">Map all to best suggestion</button>':'')+
    (plan.issues.length?'<h2 style="margin-top:12px">Rejected rows</h2><div class="small" style="max-height:130px;overflow:auto">'+plan.issues.slice(0,60).map(i=>'Row '+i.n+': <b>'+esc(i.msg)+'</b> <span class="mut">'+esc(i.d)+'</span>').join('<br>')+'</div>':'')+
    (plan.dups.length?'<h2 style="margin-top:12px">Skipped duplicates / conflicts</h2><div class="small" style="max-height:130px;overflow:auto">'+plan.dups.slice(0,60).map(i=>'Row '+i.n+': '+esc(i.inv||'')+' '+esc(i.party)+' - <b>'+esc(i.msg)+'</b>').join('<br>')+(plan.dups.length>60?'<br>...':'')+'</div>':'')+
    '<div class="acts"><button class="btn sec" data-act="close">Cancel</button><button class="btn" id="pgo" '+(plan.ok.length?'':'disabled')+'>Import '+plan.ok.length+' entries</button></div>',true);
  $('#mapall')&&($('#mapall').onclick=()=>{$$('select[data-un]').forEach(s=>{if(s.options.length>1)s.selectedIndex=1})});
  $('#pgo').onclick=()=>{const map={};$$('select[data-un]').forEach(s=>map[s.dataset.un]=s.value);
    const r=commitPlan(plan,map,fname);closeModal();toast('Imported '+plan.ok.length+' entries'+(r.created?' ('+r.created+' new parties)':''));render()};
}

function dupsView(){
  const out=[],seen=new Set(),PB=pbig();const keys=Object.keys(DB.parties);
  const gst=n=>/GST/i.test(n)?(/NON\s*-?\s*GST/i.test(n)?'N':'G'):'';
  const cand=keys.filter(k=>!DB.opening[k]);
  for(const k of cand){const A=PB[k];let best=null;
    for(const o of keys){if(o===k)continue;const s=dice(A,PB[o]);if(s>=0.8&&(!best||s>best[1]))best=[o,s]}
    if(best){const id=[k,best[0]].sort().join('|');if(!seen.has(id)){seen.add(id);out.push({a:k,b:best[0],s:best[1],gst:gst(pname(k))!==gst(pname(best[0]))})}}}
  out.sort((x,y)=>y.s-x.s);
  modal('<h2>Possible duplicate parties</h2><div class="sub">New-this-year names that closely match another party. Review each - only merge genuine spelling variants.</div><div style="max-height:60vh;overflow:auto"><table><thead><tr><th>New / unmatched name</th><th>Looks like</th><th class="n">Match</th><th></th></tr></thead><tbody>'+
    (out.slice(0,250).map(r=>'<tr><td class="w">'+esc(pname(r.a))+'</td><td class="w">'+esc(pname(r.b))+(r.gst?' <span class="pill warn">GST variant</span>':'')+'</td><td class="n">'+Math.round(r.s*100)+'%</td><td><button class="btn sm sec" data-act="domerge" data-a="'+esc(r.a)+'" data-b="'+esc(r.b)+'">Merge into '+(DB.opening[r.b]?'opening party':'right')+'</button></td></tr>').join('')||'<tr><td colspan="4" class="mut" style="padding:20px">No likely duplicates found.</td></tr>')+'</tbody></table></div><div class="acts"><button class="btn sec" data-act="close">Close</button></div>',true);
}

  const L=$('#lock'),inp=$('#lpin'),msg=$('#lmsg'),box=$('.lbox');let fails=0,until=0,idle;

  const go=()=>{if(Date.now()<until){msg.textContent='Too many attempts - wait '+Math.ceil((until-Date.now())/1000)+'s';return}
    if(hs('emerald|'+inp.value.trim())===PH){fails=0;L.classList.add('off');inp.value='';arm()}
    else{fails++;msg.textContent=fails>=5?'Locked for 30 seconds':'Wrong PIN - try again';msg.classList.add('bad');if(fails>=5){until=Date.now()+30000;fails=0}inp.value='';box.style.animation='none';void box.offsetWidth;box.style.animation='shk .4s';inp.focus()}};
  $('#lgo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  ['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(L.classList.contains('off'))arm()},{passive:true}));
  const clk=()=>{const d=new Date();$('#lclock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());$('#ldate').textContent=d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};clk();setInterval(clk,15000);
  $('#lockBtn').onclick=lock;setTimeout(()=>inp.focus(),100);
})();
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),x=document.createElement('span');x.className='rip';x.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(x);setTimeout(()=>x.remove(),600)});
/* ===== init ===== */
(async function(){
  const asOn=$('#asOn');asOn.value=UI.asOn;asOn.onchange=()=>{UI.asOn=asOn.value||todayISO();render()};
  applyTheme();renderNav();
  await loadFromSheet(false);
})();
</script>
